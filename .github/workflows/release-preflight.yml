name: release-preflight

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  campus-system-preflight:
    name: Campus-System preflight
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      P3_DATABASE_ENGINE: sqlite
      P3_SQLITE_PATH: data/p3_ci.sqlite3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            campus_p3/requirements.txt

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend\requirements.txt -r campus_p3\requirements.txt

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Run release preflight
        run: python scripts\preflight_release_check.py

      - name: Upload smoke outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: campus-system-smoke-output
          path: |
            data\exams
            data\*.sqlite3
          if-no-files-found: ignore
